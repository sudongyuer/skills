<!--
  Comment thread snippet: avatar, author, timestamp, body, one nested reply.
  Tokens: --color-neutral-{3,7,9,10}, --color-accent, --color-border, --radius-pill, type roles.
-->
<section style="display: grid; gap: var(--space-4); padding: var(--space-5) 0;">
  <article style="display: grid; grid-template-columns: 36px 1fr; gap: var(--space-3);">
    <div aria-hidden="true" class="t-secondary" style="width: 36px; height: 36px; border-radius: var(--radius-pill); background: var(--color-neutral-3); display: grid; place-items: center; font-weight: var(--font-weight-medium);">A</div>
    <div>
      <header style="display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: var(--space-1);">
        <strong class="t-body" style="font-weight: var(--font-weight-medium); color: var(--color-neutral-10);">Alex Doe</strong>
        <span class="t-meta">2 hours ago</span>
      </header>
      <p class="t-body" style="margin: 0; color: var(--color-neutral-9);">
        A comment body in the body role. Long text wraps naturally and keeps the default line-height.
      </p>
      <footer style="margin-top: var(--space-1);">
        <button class="btn t-meta" type="button" style="min-height: 0; padding: 0; border: none; background: none; color: var(--color-neutral-7);">Reply</button>
      </footer>
    </div>
  </article>

  <article style="display: grid; grid-template-columns: 36px 1fr; gap: var(--space-3); margin-left: var(--space-6); padding-left: var(--space-4); border-left: 2px solid var(--color-border);">
    <div aria-hidden="true" class="t-secondary" style="width: 36px; height: 36px; border-radius: var(--radius-pill); background: var(--color-neutral-3); display: grid; place-items: center; font-weight: var(--font-weight-medium);">S</div>
    <div>
      <header style="display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: var(--space-1);">
        <strong class="t-body" style="font-weight: var(--font-weight-medium); color: var(--color-neutral-10);">Sam Roe</strong>
        <span class="t-meta" style="padding: 0 var(--space-1); border: 1px solid var(--color-border); border-radius: var(--radius-sm);">Author</span>
        <span class="t-meta">1 hour ago</span>
      </header>
      <p class="t-body" style="margin: 0; color: var(--color-neutral-9);">
        A nested reply. Hierarchy comes from indentation and a hairline, not from color.
      </p>
    </div>
  </article>
</section>
