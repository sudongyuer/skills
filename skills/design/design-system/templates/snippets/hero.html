<!--
  Hero snippet. Paste into <main class="mockup-shell"> of scaffold.html.
  Tokens: --color-accent, --color-border, --space-*, type roles.
-->
<section style="display: grid; gap: var(--space-4); padding: var(--space-6) 0; border-bottom: 1px solid var(--color-border);">
  <p class="t-eyebrow" style="margin: 0;">Eyebrow label</p>
  <h1 class="t-display" style="margin: 0;">One clear headline that says what this is</h1>
  <p class="t-body" style="margin: 0; max-width: 56ch; color: var(--color-neutral-7);">
    A single supporting sentence. Keep it short; the page does the rest.
  </p>
  <div style="display: flex; flex-wrap: wrap; gap: var(--space-3); padding-top: var(--space-2);">
    <button class="btn btn-primary" type="button">Primary action</button>
    <button class="btn" type="button">Secondary</button>
  </div>
</section>
