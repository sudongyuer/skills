<!--
  Code block snippet: file label, copy action, monospace body.
  Tokens: --color-neutral-{1,2,3,7,9}, --color-border, --font-mono, --radius-md, mono role.
-->
<figure style="margin: var(--space-5) 0; background: var(--color-neutral-1); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden;">
  <header class="t-mono" style="
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-1) var(--space-2) var(--space-1) var(--space-4);
    background: var(--color-neutral-2);
    border-bottom: 1px solid var(--color-border);
    color: var(--color-neutral-7);
  ">
    <span>example.css</span>
    <button class="btn t-meta" type="button" style="min-height: 0; padding: var(--space-1) var(--space-2); border: none; background: none;">Copy</button>
  </header>
  <pre class="t-mono" style="margin: 0; padding: var(--space-4); overflow-x: auto; color: var(--color-neutral-9);"><code>.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
}</code></pre>
</figure>
