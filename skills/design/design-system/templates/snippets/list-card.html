<!--
  List card snippet: feed / inbox row with a status marker (color + shape).
  Tokens: --color-neutral-{2,7,10}, --color-accent, --color-border, --space-*.
-->
<a href="#" style="
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: var(--space-1) var(--space-3);
  align-items: start;
  min-height: var(--touch-min);
  padding: var(--space-4);
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid var(--color-border);
  transition: background var(--duration-fade) var(--ease-enter);
" onmouseover="this.style.background='var(--color-neutral-2)'" onmouseout="this.style.background='transparent'">
  <!-- In progress: accent + filled circle. Swap per the status table. -->
  <span aria-hidden="true" style="
    grid-row: 1 / span 2;
    width: var(--space-2);
    height: var(--space-2);
    margin-top: var(--space-2);
    border-radius: var(--radius-pill);
    background: var(--color-accent);
  "></span>
  <h3 class="t-body" style="margin: 0; font-weight: var(--font-weight-medium); color: var(--color-neutral-10);">
    Item title that may wrap onto a second line
  </h3>
  <span class="t-meta" style="white-space: nowrap;">3 min ago</span>
  <p class="t-secondary" style="grid-column: 2 / span 2; margin: 0;">
    In progress · Project name · Short description
  </p>
</a>
